title: Jayant Blogs
description: Read my mind
url: https://jporwal05.github.io
baseurl: ""

remote_theme: pages-themes/midnight@v0.2.0

collections:
  posts:
    output: true
    permalink: /blog/:slug/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      published: true

plugins:
  - jekyll-feed